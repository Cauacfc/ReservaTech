spring.application.name=reservatech-api
server.port=8080

# ---------- Banco de dados principal: MySQL ----------
# Os valores abaixo podem ser trocados por variaveis de ambiente (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD).
# O banco "reservatech" e criado automaticamente se ainda nao existir.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reservatech}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O Hibernate cria as tabelas que ainda nao existem (usuarios, restaurantes, mesas, reservas, notificacoes)
# e mantem os dados entre as execucoes. Os dados de exemplo sao inseridos pelo DataSeeder apenas na primeira vez.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
